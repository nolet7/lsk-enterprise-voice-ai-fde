apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: lsk-api, namespace: lsk-voice}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: lsk-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
# Worker autoscaling should use concurrent-session custom metrics, not CPU alone.
