apiVersion: apps/v1
kind: Deployment
metadata: {name: lsk-voice-worker, namespace: lsk-voice}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lsk-voice-worker}
  template:
    metadata:
      labels: {app: lsk-voice-worker}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/REPLACE_OWNER/lsk-enterprise-voice-ai-fde-worker:REPLACE_IMMUTABLE_TAG
          envFrom: [{secretRef: {name: lsk-runtime-secrets}}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
