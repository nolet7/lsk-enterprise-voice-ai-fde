<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LSK Contact Center</title><style>body{font:16px system-ui;background:#f4f6fa;color:#17233f;max-width:1050px;margin:auto;padding:24px}section{background:white;padding:22px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}input,button,select{padding:10px;margin:5px}button{background:#193b70;color:white;border:0;border-radius:5px;cursor:pointer}pre{white-space:pre-wrap;background:#edf2f7;padding:14px;max-height:320px;overflow:auto}.warn{color:#9b421c}</style></head><body><h1>LSK Enterprise Customer Experience</h1><p class="warn">Fictional customer data. Browser WebRTC is a real audio connection only when LiveKit and inference credentials are configured. SMS events are simulations; not PSTN calls.</p><section><h2>Customer session</h2><label>Channel <select id="channel"><option value="web-voice">Browser voice</option><option value="web-chat">Web chat</option><option value="sms-sim">Simulated SMS</option></select></label><label><input id="consent" type="checkbox">I consent to transcript capture (also requires server opt-in)</label><button onclick="start()">Start interaction</button><p id="session"></p><label>Customer ID <input id="customer" value="C100"></label><label>Demo verification code <input id="code" type="password"></label><button onclick="verify()">Verify securely</button><button onclick="orders()">My orders</button><label>Order ID <input id="order" value="O-1001"></label><button onclick="delivery()">Delivery status</button><p><input id="chat" placeholder="Ask about an order"><button onclick="chat()">Send web chat</button></p><button onclick="voice()">Connect real browser voice</button><button onclick="hangup()">Disconnect voice</button><button onclick="transfer()">Request human</button><pre id="output" aria-live="polite"></pre></section><section><h2>Agent console (local demo operator)</h2><input id="operator" type="password" placeholder="LSK_OPERATOR_KEY"><button onclick="dashboard()">Refresh queue and cases</button><div id="cases"></div><pre id="dash"></pre></section><script type="module">
import {Room,RoomEvent} from 'https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs';
let sid=null,room=null;
const $=x=>document.getElementById(x);
const show=x=>$('output').textContent=JSON.stringify(x,null,2);
async function req(path,method='GET',body,operator=false){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(operator?{'X-Operator-Key':$('operator').value}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));return j}
function guard(fn){return async()=>{try{await fn()}catch(e){show({error:e.message})}}}
window.start=guard(async()=>{const x=await req('/api/v1/sessions','POST',{channel:$('channel').value,consent_transcript:$('consent').checked});sid=x.session_id;$('session').textContent='Session '+sid;show(x)});
window.verify=guard(async()=>show(await req('/api/v1/sessions/'+sid+'/verify','POST',{customer_id:$('customer').value,code:$('code').value})));
window.orders=guard(async()=>show(await req('/api/v1/sessions/'+sid+'/orders')));
window.delivery=guard(async()=>show(await req('/api/v1/sessions/'+sid+'/orders/'+encodeURIComponent($('order').value)+'/delivery')));
window.chat=guard(async()=>show(await req('/api/v1/sessions/'+sid+'/messages','POST',{text:$('chat').value})));
window.transfer=guard(async()=>show(await req('/api/v1/sessions/'+sid+'/transfer','POST',{reason:'Customer requested live assistance'})));
window.hangup=guard(async()=>{if(room){await room.disconnect();room=null}show({disconnected:true})});
window.voice=guard(async()=>{if(!sid)throw Error('Start a session first');const x=await req('/api/v1/sessions/'+sid+'/livekit-token','POST');room=new Room();room.on(RoomEvent.Disconnected,()=>show({voice:'disconnected'}));await room.connect(x.url,x.token);await room.localParticipant.setMicrophoneEnabled(true);show({voice:'connected to real LiveKit room',room:x.room,telephony:false})});
window.dashboard=guard(async()=>{const d=await req('/api/v1/operator/dashboard','GET',null,true);$('dash').textContent=JSON.stringify({counters:d.counters,recent_events:d.recent_events},null,2);$('cases').replaceChildren();for(const c of d.cases){const row=document.createElement('p');row.textContent=c.id+' — '+c.reason+' — '+c.state;const b=document.createElement('button');b.textContent='Accept';b.onclick=guard(async()=>{await req('/api/v1/operator/cases/'+c.id+'/accept','POST',null,true);await window.dashboard()});row.appendChild(b);$('cases').appendChild(row)}})
</script></body></html>
